# Isolated build-only verification. Dummy local URLs are never used for migrations.
when:
  - event: [push, manual]
    branch: ci/woodpecker-build-pilot
steps:
  - name: build
    image: node:22-bookworm
    environment:
      COREPACK_ENABLE_AUTO_PIN: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci"
    commands:
      - corepack pnpm@10.28.2 install --frozen-lockfile
      - corepack pnpm@10.28.2 exec prisma generate
      - corepack pnpm@10.28.2 run build
      - test -s .next/BUILD_ID
